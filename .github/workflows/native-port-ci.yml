name: Native Port CI

# Continuous verification of the native macOS/Linux 64-bit port work. Nothing else in CI touches
# any of it: the Windows presets in ci.yml cannot see a portability regression, so every number
# in docs/porting/ silently rots on the next upstream merge. Each job here turns one of those
# measurements into a pass/fail signal.
#
# Deliberately NOT here: the Wine/VC6 Docker game build (scripts/docker-build.sh). It takes ~10
# minutes, and it is the manual release gate, not a per-push check.
#
# When this runs, and what runs:
#  * On a pull request, only the jobs whose measurement the diff can move. The `changes` job below
#    classifies the diff and every heavy job is gated on one of its outputs, because this workflow
#    is 12 jobs (~45 runner-minutes, 3 of them macOS at a 10x billing multiplier) and a
#    docs-only change cannot move a single number in it. Measured on this repo: ~44% of recent
#    commits touch only docs/ and .agents/.
#  * On push to main and on workflow_dispatch, everything, unconditionally -- `changes` forces its
#    outputs true off pull_request. Nothing lands on main unmeasured; the path gating only decides
#    what a pull request pays for, never what main is held to.
#  * NOT on push to 'devin/**'. Those branches always have a pull request, so a push trigger ran
#    the whole 12-job fan-out a second time for the same commit and both halves then sat in the
#    runner queue behind each other.
#  * The cheap tier (lint, d3d8-surface) is not gated: it is seconds on a bare runner, it needs no
#    container, and a docs-only change genuinely can break it -- docs/porting/STATUS.md is
#    generated, and check-generated-baselines.py is the first diagnosis when a baseline was
#    hand-merged.
#
# `required-checks` at the bottom aggregates the lot, so branch protection has one check to
# require that stays correct as jobs are added, skipped or renamed.
#
# Reproducibility notes:
#  * The Linux jobs run in a digest-pinned ubuntu:22.04 container rather than on the runner image,
#    because the probe's clean-TU count depends on the clang version and the spike's readback
#    depends on the Mesa/llvmpipe version. Pinning the runner label alone would not survive
#    GitHub retiring an image.
#  * The probe's third-party headers (dx8, gamespy, miles, lzhl) are provisioned explicitly by
#    scripts/ci/fetch-probe-deps.sh from the commits cmake/*.cmake pins. They are NOT taken from
#    an untracked build/docker/_deps tree: whether that directory exists changes the probe's
#    answer (114 vs 115 clean, see docs/porting/review-and-decisions.md 1.2), so relying on a
#    Docker build by-product would make this job non-reproducible.
#  * No secrets are used, so everything works on a fork.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Container jobs default to `sh`, which has no `pipefail`.
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Linux jobs run in digest-pinned containers rather than on the runner image. The probe and
# the OpenAL build use ubuntu:22.04 (clang 14), the toolchain every number in docs/porting/ was
# measured with. The renderer spike uses ubuntu:24.04, because jammy's Vulkan headers (1.3.204)
# predate VK_KHR_portability_enumeration and cannot compile the MoltenVK portability opt-in --
# measured, see the PR description. `container.image` cannot read the `env` context, so each
# digest is repeated per job rather than named once.
jobs:
  # 0. What did this change touch? Every heavy job below is gated on one of these outputs.
  #
  #    The rules live in scripts/ci/classify-changes.py rather than in a paths-filter block here,
  #    for one reason: `code` is the *complement* of the prose list, and expressing a complement in
  #    a glob-matching action means negation patterns whose semantics decide whether a gate runs.
  #    Getting that subtly wrong skips a gate silently. The script carries a --self-check the lint
  #    job runs, so the classification is asserted against paths from real commits before a branch
  #    is ever pushed.
  #
  #    Off pull_request (push to main, workflow_dispatch) every output is forced true: main is the
  #    branch every number in docs/porting/ is quoted from and it is held to the whole suite.
  changes:
    name: What changed?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # `github.event_name != 'pull_request'` is the "run everything on main" clause.
      code: ${{ steps.classify.outputs.code == 'true' || github.event_name != 'pull_request' }}
      renderer: ${{ steps.classify.outputs.renderer == 'true' || github.event_name != 'pull_request' }}
      window: ${{ steps.classify.outputs.window == 'true' || github.event_name != 'pull_request' }}
      audio: ${{ steps.classify.outputs.audio == 'true' || github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The classification is against the merge base, so the base branch's history is needed.
          fetch-depth: 0

      - name: Classify the diff
        id: classify
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Three-dot: what this branch changed, not what main changed underneath it.
          git diff --name-only "$(git merge-base "$BASE_SHA" HEAD)" HEAD \
            | python3 scripts/ci/classify-changes.py | tee -a "$GITHUB_OUTPUT"

      - name: Summary
        env:
          CODE: ${{ steps.classify.outputs.code }}
          RENDERER: ${{ steps.classify.outputs.renderer }}
          WINDOW: ${{ steps.classify.outputs.window }}
          AUDIO: ${{ steps.classify.outputs.audio }}
          EVENT: ${{ github.event_name }}
        run: |
          {
            echo '## What changed'
            if [ "$EVENT" != 'pull_request' ]; then
              echo "Event \`$EVENT\`: every job runs, regardless of the paths touched."
            else
              echo
              echo "| area | can this diff move it? |"
              echo "| --- | --- |"
              echo "| code (probe, build, seams) | $CODE |"
              echo "| renderer | $RENDERER |"
              echo "| window | $WINDOW |"
              echo "| audio | $AUDIO |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # 0a. The lint rung of the verification ladder, which was not in CI at all: the scripts these
  #     gates are written in, and the workflows that run them. Seconds, and ungated -- a broken
  #     scripts/ci/*.py is the most common way for every other job here to fail confusingly.
  lint:
    name: Lint (flake8, actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pinned because pycodestyle's findings depend on the interpreter: since PEP 701 (3.12) it
      # tokenizes inside f-strings, so a 3.12 runner reports E741/E501 inside f-string expressions
      # that a 3.10 one does not. 3.10 is what the dev environment provides, so this keeps the
      # local rung of the ladder and this job in agreement.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install the linters
        run: |
          set -eux
          python3 -m pip install --quiet 'flake8==7.1.1'
          # Both pinned to a version rather than curl|bash from a release page, so the lint result
          # cannot change under a commit that touched nothing.
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      # Line length and the exclusions for the upstream tooling under scripts/cpp/ come from
      # .flake8, so this is the same command the contributor guide and the local ladder run.
      - name: flake8
        run: python3 -m flake8 scripts/

      # --severity=error for shellcheck, which actionlint shells out to whenever it is on PATH: it
      # is on the hosted runners and is absent from most local environments, so without this the job
      # reports findings the local rung of the ladder cannot reproduce. The workflows carry 45
      # info/style/warning findings, mostly SC2086 unquoted "$GITHUB_OUTPUT" in upstream files;
      # fixing those means rewriting shell this port does not own, and conflicting with every future
      # upstream merge. Errors -- the ones where the script does not do what it reads as -- still
      # fail the job.
      - name: actionlint
        env:
          SHELLCHECK_OPTS: --severity=error
        run: |
          set -eux
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml

      # The harness logic that decides what the published numbers MEAN: which pile an unresolved
      # symbol lands in, and what the baseline gate asserts once an executable exists. Pure Python,
      # so it belongs in the cheap tier -- and both halves were wrong in ways no compile or link
      # could reveal, which is why they are pinned instead of re-derived by eye.
      - name: Check the symbol categorisation and the binary gate
        run: |
          set -o pipefail
          {
            echo '## Symbol categorisation and binary gate'
            echo '```'
            python3 scripts/native-build-categorise-test.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The rules that decide which jobs this workflow skips, checked against paths from real
      # commits. A wrong answer here does not fail anything by itself -- it silently does not run a
      # gate -- so it is asserted rather than trusted.
      - name: Check the change-classification rules
        run: |
          set -o pipefail
          {
            echo '## Change classification rules'
            echo '```'
            python3 scripts/ci/classify-changes.py --self-check
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # 0b. The gates that read the tree and nothing else: no toolchain, no container, no build, about a
  #     minute in total. Ungated for a reason -- window-input-scan.py walks the whole repository and
  #     compares the Win32 window/event/input surface against a checked-in baseline, so *any* engine
  #     file can move its count. Gating that on a path list would let an unrelated file grow the
  #     surface with the count unchecked, which is the failure mode the classifier is written to
  #     avoid. These ran inside the (gated, build-heavy) window-seam jobs before.
  source-scans:
    name: Source scans (no build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan the Win32 window/event/input surface against the baseline
        run: |
          set -o pipefail
          {
            echo '## Win32 window / event loop / input surface'
            echo '```'
            python3 scripts/window-input-scan.py --check
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check both backends' scan-code tables against KeyScanCodes.h
        run: |
          set -o pipefail
          {
            echo '## Scan-code tables'
            echo '```'
            python3 scripts/ci/check-window-scancodes.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check the engine's non-Windows window/input path goes through the seam
        run: |
          set -o pipefail
          {
            echo '## Window seam wiring'
            echo '```'
            python3 scripts/ci/check-window-seam-wiring.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # An init() that cannot report a failure is how the .csf desync in #87 reached the window
      # title instead of a crash log, so the enumeration in docs/porting/init-failure-reporting.md
      # is ratcheted: no startup subsystem may report less loudly than the baseline, and a new one
      # has to be able to report at all. Text scan, no build.
      - name: Check startup init failure reporting against the baseline
        run: |
          set -o pipefail
          {
            echo '## Startup init failure reporting'
            echo '```'
            python3 scripts/init-reporting-scan.py --check --quiet
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # 1. The native 64-bit clang readiness probe, gated against a checked-in baseline so a
  #    portability regression fails the build instead of printing a smaller number.
  native-probe:
    name: Native probe (Linux, clang 14)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04@sha256:3b06811b2afd352be909dd088a004166d665dc76d38b13eada33522a9d915c6f
    timeout-minutes: 30
    steps:
      - name: Install toolchain
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          # zlib1g-dev is not incidental: without <zlib.h> CompressionManager.cpp fails to
          # preprocess and the clean count silently drops by one (measured: 114 instead of 115).
          apt-get install -y --no-install-recommends \
            clang-14 python3 git ca-certificates zlib1g-dev
          clang++-14 --version

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # SKIP_FFMPEG_LIBS: this job compiles and never links, so building FFmpeg's shared libraries
      # here would be minutes of runner time no measurement in it can use. The headers it does need
      # are fetched either way.
      - name: Provision the third-party headers the probe needs
        env:
          SKIP_FFMPEG_LIBS: '1'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/ci/fetch-probe-deps.sh

      - name: Probe (native, no Windows SDK)
        env:
          CLANGXX: clang++-14
        run: |
          python3 scripts/native-port-probe.py \
            --report native-port-probe-native.md --json probe-native.json

      - name: Probe (shimmed)
        env:
          CLANGXX: clang++-14
        run: |
          python3 scripts/native-port-probe.py --with-shims \
            --report native-port-probe-shimmed.md --json probe-shimmed.json

      - name: Gate against the checked-in baselines
        run: |
          set -o pipefail
          {
            echo '## Native probe'
            echo '```'
            python3 scripts/ci/check-probe-baseline.py --results probe-native.json
            python3 scripts/ci/check-probe-baseline.py --results probe-shimmed.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check the CRT/wide-character compat layer
        env:
          CLANGXX: clang++-14
        run: |
          set -o pipefail
          {
            echo '## CRT / wide-character compat layer'
            echo '```'
            python3 scripts/ci/check-crt-compat.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the probe reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-port-probe-reports
          path: |
            native-port-probe-native.md
            native-port-probe-shimmed.md
            probe-native.json
            probe-shimmed.json

  # 2. The same translation units, compiled to object files and linked. The probe above answers
  #    "does it parse"; this answers "does it produce code, and what does that code reference that
  #    nothing defines". Two ratchets: objects must not go down, unresolved symbols must not go up.
  #    The executable itself is the levels 1-4 job's business, below: this level set excludes the
  #    libraries most of its unresolved symbols are defined in.
  #
  #    Same container as the probe on purpose -- object counts and libstdc++ symbol availability
  #    are compiler-version dependent, and the checker refuses to compare across clang majors.
  native-build:
    name: Native build (Linux, clang 14, 64-bit)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04@sha256:3b06811b2afd352be909dd088a004166d665dc76d38b13eada33522a9d915c6f
    timeout-minutes: 45
    steps:
      - name: Install toolchain
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          # make/gcc/nasm build FFmpeg's libraries (fetch-probe-deps.sh; its configure wants a C
          # compiler that is not clang++), libsdl2-dev is the window
          # backend this build chooses off Apple, and `file` is what the report quotes for the
          # executable's architecture. libvulkan-dev is the render backend's link library and
          # glslang-tools compiles its four shaders; its *headers* come from fetch-probe-deps.sh at
          # a pinned tag, because jammy's predate VK_KHR_portability_enumeration.
          apt-get install -y --no-install-recommends \
            clang-14 cmake ninja-build python3 git ca-certificates binutils zlib1g-dev \
            libopenal-dev fonts-dejavu-core make gcc nasm libsdl2-dev file \
            libvulkan-dev glslang-tools
          clang++-14 --version

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Provision the third-party headers
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/ci/fetch-probe-deps.sh

      # --strict-link is what the baseline was measured with, and the checker refuses to compare a
      # result that lacks it: the executable figure it gates goes unmeasured otherwise. Without
      # level 4 the strict link is still short of an executable -- most of what levels 1-3 cannot
      # resolve is defined in the renderer and audio libraries this build excludes -- so its
      # non-zero exit is recorded rather than failing the job, and the ratchet is the baseline check
      # below. The levels 1-4 job is where the link completes and the gate is that it still does.
      - name: Compile objects and link (shimmed, levels 1-3, strict link attempted)
        env:
          CLANGXX: clang++-14
        run: |
          set +e
          python3 scripts/native-build.py --level 1 --level 2 --level 3 --with-shims \
            --strict-link \
            --report native-build-report.md --json native-build.json
          echo "strict link exit status: $?" | tee -a "$GITHUB_STEP_SUMMARY"
          # The measurement itself must still have run: a missing JSON is a broken harness, and
          # without this the `set +e` above would swallow it.
          test -f native-build.json

      - name: Gate against the checked-in baseline
        run: |
          set -o pipefail
          {
            echo '## Native 64-bit build'
            echo '```'
            python3 scripts/ci/check-native-build-baseline.py --results native-build.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The total is a ratchet, so a new Win32 dependency can hide behind a drop elsewhere. This
      # pins the category by symbol name. See docs/porting/win32-file-api-seam.md.
      - name: Gate the undefined Win32 API category
        run: |
          set -o pipefail
          {
            echo '## Undefined Win32 API symbols'
            echo '```'
            python3 scripts/ci/check-win32-undefined.py --results native-build.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The audio backend is the engine's real audio device off 32-bit Windows, so the build links
      # it and no AIL_* symbol may be unresolved. Both halves matter: the archive being absent would
      # take the count back up by 60 with nothing else changed, and an AIL_* the backend does not
      # define is a hole neither surface scan can see. See docs/porting/audio-device-seam.md.
      - name: Gate the audio backend in the link
        run: |
          set -o pipefail
          {
            echo '## OpenAL audio backend linked'
            echo '```'
            python3 scripts/ci/check-audio-backend-linked.py --results native-build.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The embedded Internet Explorer control was the last thing stopping GeneralsMD/Code/Main --
      # the game's entry point -- from producing an object. It stays Windows-only, and the excision
      # stays out of its consumers. See docs/porting/embedded-browser-seam.md.
      - name: Gate the embedded-browser seam
        run: |
          set -o pipefail
          {
            echo '## Embedded browser seam'
            echo '```'
            python3 scripts/ci/check-embedded-browser.py --results native-build.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The single-player main menu reaches online code, so it has to compile with the online path
      # absent. Pins those translation units by name and the cut GameSpy SDK category by symbol.
      # See docs/porting/online-absent-menu-seam.md.
      - name: Gate the menu path against the online path's absence
        run: |
          set -o pipefail
          {
            echo '## Single-player menu with online absent'
            echo '```'
            python3 scripts/ci/check-online-absent-seam.py --results native-build.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Linking the seam says nothing about what it does. This runs FindFirstFile()'s patterns,
      # the directory attribute, GetFullPathName()'s buffer protocol and the case-insensitive
      # lookup against a real directory tree. See docs/porting/win32-file-api-seam.md.
      - name: Run the Win32 file API seam's behaviour test
        env:
          CLANGXX: clang++-14
        run: |
          set -o pipefail
          {
            echo '## Win32 file API seam behaviour'
            echo '```'
            python3 scripts/native-win32-file-test.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Same argument for the kernel32 runtime seam: that it links says nothing about whether the
      # mutex is recursive, whether the Interlocked calls return the value the lock-free queue
      # compares against, or whether lstrcpyn() counts the terminator.
      # See docs/porting/win32-runtime-and-crt-gaps.md.
      - name: Run the Win32 runtime seam's behaviour test
        env:
          CLANGXX: clang++-14
        run: |
          set -o pipefail
          {
            echo '## Win32 runtime seam behaviour'
            echo '```'
            python3 scripts/native-win32-runtime-test.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Bink is Windows-only and the port plays video through RTS_BUILD_OPTION_FFMPEG, so an
      # unconditional `bink.h` include is a regression rather than a missing port. This also asserts
      # the headers fetch-probe-deps.sh provisions are there, so the counts above cannot come from a
      # dependency that only exists on someone's box. See docs/porting/video-and-harness-headers.md.
      - name: Gate the video path and the provisioned headers
        run: |
          set -o pipefail
          {
            echo '## Video path and provisioned headers'
            echo '```'
            python3 scripts/ci/check-video-headers.py --results native-build.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The D3DX 8 math entry points are pure convention -- D3DX multiplies a row vector on the left
      # and puts the translation in the fourth row, WWMath does the opposite -- so an implementation
      # with the operands or the transpose reversed compiles, links, and renders a subtly wrong
      # picture. Nothing above can see that. This asserts the numbers against D3DX's definition.
      # See docs/porting/d3dx8-math-seam.md.
      - name: Run the D3DX math entry points' numerical test
        env:
          CLANGXX: clang++-14
        run: |
          set -o pipefail
          {
            echo '## D3DX 8 math entry points'
            echo '```'
            python3 scripts/native-d3dx8math-test.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The D3DX texture/FVF/shader entry points: the FVF vertex size is a pure function of the
      # bitmask, the mip filter and the surface blit have exact expected pixels, the size, mip count
      # and format a texture is created with are a function of the device's caps, and the shader
      # assembler and the file loader must FAIL rather than hand back something a caller would treat
      # as bytecode or as a texture. See docs/porting/d3dx8-texture-seam.md.
      - name: Run the D3DX texture, FVF and shader entry points' behaviour test
        env:
          CLANGXX: clang++-14
        run: |
          set -o pipefail
          {
            echo '## D3DX 8 texture, FVF and shader entry points'
            echo '```'
            python3 scripts/native-d3dx8-entrypoints-test.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The window/GDI seam is where the points-versus-pixels decision bites: GetClientRect and
      # GetMonitorInfo answer in points, the renderer works in pixels, and the CI runner's backing
      # scale is 1, so a doubled number cannot fail anywhere else in this workflow. This drives the
      # entry points over a faked window seam with a known geometry, and asserts the composed
      # sizing path DX8Wrapper uses, not just the return codes. See docs/porting/window-gdi-seam.md.
      - name: Run the user32 window/GDI seam's behaviour test
        env:
          CLANGXX: clang++-14
        run: |
          set -o pipefail
          {
            echo '## user32 window/GDI seam'
            echo '```'
            python3 scripts/native-win32-user32-test.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The negative control for init-failure reporting: a subsystem whose init() is made to fail
      # must be diagnosable, and the shape it replaces -- detect the failure and return -- must
      # provably not be. Needs no game data. See docs/porting/init-failure-reporting.md.
      - name: Run the init-failure reporting negative control
        env:
          CLANGXX: clang++-14
        run: |
          set -o pipefail
          {
            echo '## Init failure reporting'
            echo '```'
            python3 scripts/native-init-failure-test.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The negative control for the base-game install-path diagnostic: Zero Hour mounts the base
      # game's archives from the InstallPath setting, and a failure there used to be silent in a
      # release build. Needs no game data. See docs/porting/base-game-install-path.md.
      - name: Run the base-game install-path negative control
        env:
          CLANGXX: clang++-14
        run: |
          set -o pipefail
          {
            echo '## Base-game install path reporting'
            echo '```'
            python3 scripts/native-base-game-install-test.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The GDI font seam draws the text the WND GUI measures its layout against, so "text appears"
      # is not the acceptance criterion: the advance widths and the line height are. This compares
      # the port's CreateFont/GetTextMetrics/GetTextExtentPoint32W against recorded GDI metrics --
      # fonts-dejavu-core above is the font both sides are pointed at. See
      # docs/porting/gdi-font-seam.md.
      - name: Compare the font seam's glyph metrics against GDI's
        env:
          CLANGXX: clang++-14
        run: |
          set -o pipefail
          {
            echo '## GDI font seam glyph metrics'
            echo '```'
            python3 scripts/ci/check-font-metrics.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the build report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-build-report
          path: |
            native-build-report.md
            native-build.json

  # 2a. The same build with the renderer and audio libraries added (level 4: WW3D2, WWAudio,
  #     WWDownload and GeneralsMD's WWVegas fork). Its own job rather than a second step in the
  #     one above, because it recompiles all 968 translation units and doubling that job's compile
  #     time would put it near its timeout; a separate runner costs wall-clock nothing.
  #
  #     It has its own baseline file, so adding the level cannot be read as progress against the
  #     smaller build's figures, and levels 1-3 keep their own ratchet. This is also the job that
  #     produces the port's executable, and therefore the one whose failure means there is no longer
  #     one: the strict link completes here, so this job's assertion is "the link must not break"
  #     rather than "the count must not grow". This is the job that makes
  #     the unresolved-symbol total mean something: without level 4, most of what levels 1-3 cannot
  #     resolve is simply defined in a layer that build excludes, so the total measures the scope of
  #     the harness rather than the portability of the code. docs/porting/native-build.md has the
  #     per-category movement.
  native-build-renderer:
    name: Native build + renderer (Linux, clang 14, 64-bit)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04@sha256:3b06811b2afd352be909dd088a004166d665dc76d38b13eada33522a9d915c6f
    timeout-minutes: 60
    steps:
      - name: Install toolchain
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          # make/gcc/nasm build FFmpeg's libraries (fetch-probe-deps.sh; its configure wants a C
          # compiler that is not clang++), libsdl2-dev is the window
          # backend this build chooses off Apple, and `file` is what the report quotes for the
          # executable's architecture. Without the first two the strict link is short 29 av_*
          # symbols and produces no executable, which is what this job now gates on.
          # libvulkan-dev is the render backend's link library and glslang-tools compiles its four
          # shaders; the headers come from fetch-probe-deps.sh at a pinned tag (jammy's are 1.3.204,
          # too old for VK_KHR_portability_enumeration). Without these the renderer archive is left
          # out and the object count falls short of the baseline.
          apt-get install -y --no-install-recommends \
            clang-14 cmake ninja-build python3 git ca-certificates binutils zlib1g-dev \
            libopenal-dev make gcc nasm libsdl2-dev file libvulkan-dev glslang-tools
          clang++-14 --version

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Provision the third-party headers
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/ci/fetch-probe-deps.sh

      # --strict-link attempts the link the loader would accept: no --warn-unresolved-symbols, so
      # unresolved symbols are errors. This is the one job where that link COMPLETES, so unlike the
      # levels 1-3 job below it runs without `set +e`: a non-zero exit here means the executable
      # stopped being produced, and that is a broken build rather than a bigger number. The
      # baseline check that follows says which symbols and gates the file's architecture.
      - name: Compile objects and link (shimmed, levels 1-4, strict link must produce an executable)
        env:
          CLANGXX: clang++-14
        run: |
          set -o pipefail
          python3 scripts/native-build.py --level 1 --level 2 --level 3 --level 4 --with-shims \
            --strict-link \
            --report native-build-level4-report.md --json native-build-level4.json
          test -f native-build-level4.json
          # What was produced, from the file itself. `binary_produced: true` alone does not say
          # whether the thing at that path is a 64-bit executable; the gate below reads these
          # fields, and this prints them where a reviewer of the run can see them.
          {
            echo '## The executable'
            echo '```'
            ls -l build/native/native_strict_link
            file build/native/native_strict_link
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Gate against the checked-in baseline
        run: |
          set -o pipefail
          {
            echo '## Native 64-bit build, levels 1-4 (renderer and audio included)'
            echo '```'
            python3 scripts/ci/check-native-build-baseline.py --results native-build-level4.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The render backend's surface and presentation paths are behind SPIKE_WITH_PLATFORM_WINDOW.
      # Compiled without it the engine's copy had no swapchain and Present() returned success
      # having presented nothing -- found by hand on an M1 Pro, by no check. This reads the archive
      # this job just produced, so it cannot come back silently.
      - name: Gate that the linked backend has a swapchain
        run: |
          set -o pipefail
          {
            echo '## The render backend the engine links can present'
            echo '```'
            python3 scripts/ci/check-swapchain-compiled.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The renderer libraries are where a new Win32 dependency is most likely to appear, and the
      # total is only a ratchet. Same budget file as levels 1-3: it is a set of names, and the
      # three in it are the mouse cursor path, which level 4 does not change.
      - name: Gate the undefined Win32 API category
        run: |
          set -o pipefail
          {
            echo '## Undefined Win32 API symbols (levels 1-4)'
            echo '```'
            python3 scripts/ci/check-win32-undefined.py --results native-build-level4.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The patch downloader is the library that decides whether level 4's denominator is honest:
      # it is adjacent to the cut online functionality but its symbols are still on the
      # single-player link, so it is ported rather than excluded. This pins that, and pins the one
      # source CMake comments out. See docs/porting/ww3d2-and-download-headers.md.
      - name: Gate the patch-downloader seam
        run: |
          set -o pipefail
          {
            echo '## Patch downloader seam'
            echo '```'
            python3 scripts/ci/check-download-seam.py --results native-build-level4.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Levels 1-4 are where the whole Miles surface is reached: WWAudio's 19 units compile here.
      - name: Gate the audio backend in the link
        run: |
          set -o pipefail
          {
            echo '## OpenAL audio backend linked (levels 1-4)'
            echo '```'
            python3 scripts/ci/check-audio-backend-linked.py --results native-build-level4.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The allocator's critical sections have to outlive static destruction: OpenAL Soft frees
      # memory from a static destructor, the engine's operator delete enters TheDmaCriticalSection,
      # and a destroyed section turned that into unbounded recursion and a SIGSEGV after a clean
      # exit. This links the real archives and asserts the order in one process, with a control that
      # fails the run if the late destructor did not actually run after plain statics were gone. See
      # docs/porting/memory-shutdown-order.md.
      - name: Prove the allocator's critical sections outlive static destruction
        env:
          CLANGXX: clang++-14
        run: |
          set -o pipefail
          {
            echo '## Static destruction order for the allocator'"'"'s critical sections'
            echo '```'
            python3 scripts/native-memory-shutdown-test.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Reporting a failed lock used to allocate, and the allocator is what holds the lock, so a
      # recoverable errno became an unbounded recursion at both ends of the process lifetime. This
      # makes the lock fail on purpose and requires one bounded diagnostic and an abort, against a
      # negative control that links the pre-fix path and has to die of the recursion. Without the
      # control the case would pass on a platform where the lock cannot fail at all. See
      # docs/porting/allocator-lock-failure.md.
      - name: Prove a failed lock reports without allocating (with the pre-fix control)
        env:
          CLANGXX: clang++-14
        run: |
          set -o pipefail
          {
            echo '## A lock failure in the allocator'"'"'s critical section'
            echo '```'
            python3 scripts/native-lock-failure-test.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # A leftover process holding the instance lock made every launch return from main in silence.
      # This holds the lock and requires the refusal to name the file and the holder, and requires
      # the successful path to stay quiet. See docs/porting/init-failure-reporting.md.
      - name: Prove a refused launch says why
        env:
          CLANGXX: clang++-14
        run: |
          set -o pipefail
          {
            echo '## The single instance lock refusing a launch'
            echo '```'
            python3 scripts/native-instance-lock-test.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the build report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-build-level4-report
          path: |
            native-build-level4-report.md
            native-build-level4.json

  # 2a-debug. The same levels 1-4 build in the DEBUG configuration (`-DRTS_DEBUG -DWWDEBUG -DDEBUG`,
  #     which is what cmake/config-build.cmake defines for RTS_BUILD_OPTION_DEBUG=ON), plus the
  #     negative control that the configuration is worth having.
  #
  #     Why this is a measured configuration of its own: until this job existed, `-DRTS_DEBUG` did
  #     not compile off Windows at all (11 translation units failed, 114 symbols unresolved, no
  #     executable), so every assertion the original developers wrote was absent from every native
  #     run. The cost is documented: the headless simulation probe ticked 13,500 frames of a retail
  #     map that had loaded zero objects, and the assert for that condition could not fire.
  #
  #     Its own baseline file, for the same reason level 4 has one and levels 1-3 have another: the
  #     two configurations compile different code, so their numbers are not comparable and
  #     check-native-build-baseline.py refuses to compare them. The ratchet is the release build's:
  #     failures may not grow, objects and the executable may not disappear.
  native-build-debug:
    name: Native build, debug configuration + assert negative control (Linux, clang 14)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04@sha256:3b06811b2afd352be909dd088a004166d665dc76d38b13eada33522a9d915c6f
    timeout-minutes: 60
    steps:
      - name: Install toolchain
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          # The same set as the levels 1-4 release job: this build compiles the same translation
          # units and links the same archives, only with the debug defines added.
          apt-get install -y --no-install-recommends \
            clang-14 cmake ninja-build python3 git ca-certificates binutils zlib1g-dev \
            libopenal-dev make gcc nasm libsdl2-dev file libvulkan-dev glslang-tools
          clang++-14 --version

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Provision the third-party headers
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/ci/fetch-probe-deps.sh

      - name: Compile objects and link (shimmed, levels 1-4, debug configuration)
        env:
          CLANGXX: clang++-14
        run: |
          set -o pipefail
          python3 scripts/native-build.py --level 1 --level 2 --level 3 --level 4 --with-shims \
            --config debug --strict-link --build-dir build/native-debug \
            --report native-build-debug-report.md --json native-build-debug.json
          test -f native-build-debug.json

      - name: Gate against the checked-in debug baseline
        run: |
          set -o pipefail
          {
            echo '## Native 64-bit build, levels 1-4, debug configuration'
            echo '```'
            python3 scripts/ci/check-native-build-baseline.py --results native-build-debug.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The negative control, and the reason the job exists: a debug build whose asserts are
      # compiled out or swallowed by the portable dialog stub would pass every check above. The
      # harness is the headless simulation probe, built from this build directory so it inherits the
      # debug defines; the bad input is generated, so no retail data is needed.
      - name: Prove a known-bad input trips a real engine assertion
        env:
          CLANGXX: clang++-14
        run: |
          set -o pipefail
          python3 scripts/native-sim-probe.py --build-dir build/native-debug --build
          {
            echo '## Assertion negative control (debug configuration)'
            echo '```'
            python3 scripts/ci/check-assert-fires.py --build-dir build/native-debug
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The map cache half of the path-separator seam, and the only one of its three defects that
      # does not announce itself: a key that misses is not an error, it is wrong state --
      # `m_isMultiplayer` among it. This fails on the code before that seam landed, which is what
      # makes it worth running. Generated fixture, no retail data.
      # docs/porting/path-separator-seam.md.
      - name: Prove both spellings of a map resolve to one map cache entry
        run: |
          set -o pipefail
          {
            echo '## Map cache key negative control (debug configuration)'
            echo '```'
            python3 scripts/ci/check-path-separator-keys.py --build-dir build/native-debug
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The shroud half of the water path: a river vertex in the map's border ring converts to a
      # shroud cell outside the source grid, and the shipped lookup indexed the surface with it --
      # 140 bytes before its allocation on the mission #103 faulted on. The harness puts the valid
      # cells between two PROT_NONE pages, so an out-of-grid read is a fault rather than a plausible
      # number. Generated fixture, no retail data. docs/porting/shroud-river-water-bounds.md.
      - name: Prove an out-of-grid shroud lookup answers with the border level instead of faulting
        run: |
          set -o pipefail
          {
            echo '## Shroud out-of-grid negative control (debug configuration)'
            echo '```'
            python3 scripts/ci/check-shroud-bounds.py --build-dir build/native-debug
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the debug build report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-build-debug-report
          path: |
            native-build-debug-report.md
            native-build-debug.json

  # 2b. The debug and profile libraries, which are the crash-reporting and profiling layer. The
  #     probe above only asks whether they parse; this compiles every translation unit CMake puts
  #     in core_debug and core_profile_legacy, links the debug library, and RUNS a test that
  #     captures a backtrace and asserts the symbolised frames name the test's own functions. The
  #     stack walk being present at link time and the stack walk actually working are different
  #     claims, and a native crash with no stack is the thing this seam exists to prevent.
  #     docs/porting/debug-and-profile-libs.md.
  debug-profile-seam:
    name: Debug/profile seam (Linux, clang 14)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04@sha256:3b06811b2afd352be909dd088a004166d665dc76d38b13eada33522a9d915c6f
    timeout-minutes: 20
    steps:
      - name: Install toolchain
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            clang-14 python3 git ca-certificates binutils
          clang++-14 --version

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Gate the stack walk symbols and both libraries' translation units
        env:
          CLANGXX: clang++-14
        run: |
          set -o pipefail
          {
            echo '## Debug/profile seam (Linux)'
            echo '```'
            python3 scripts/ci/check-stackwalk-symbols.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Capture and symbolise a real native backtrace
        env:
          CLANGXX: clang++-14
        run: |
          set -o pipefail
          {
            echo '## Native backtrace (Linux x86-64)'
            echo '```'
            python3 scripts/native-stackwalk-test.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # 2c. The same two checks on Apple Silicon, which is the target that made this slice necessary:
  #     the Windows path is 32-bit x86 assembly and DbgHelp, and arm64 has neither, so the
  #     backtrace()/dladdr() implementation has to be proven where it will run rather than
  #     asserted from Linux.
  debug-profile-seam-macos:
    name: Debug/profile seam (macOS arm64)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Apple's nm has no --defined-only/-C in the GNU spelling the checker uses, but the LLVM nm
      # in the Xcode toolchain does, and clang++ is Apple clang.
      - name: Gate the stack walk symbols and both libraries' translation units
        run: |
          set -o pipefail
          NM="$(xcrun --find llvm-nm)"
          export NM
          {
            echo '## Debug/profile seam (macOS arm64)'
            echo '```'
            python3 scripts/ci/check-stackwalk-symbols.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Capture and symbolise a real native backtrace
        run: |
          set -o pipefail
          {
            echo '## Native backtrace (macOS arm64)'
            echo '```'
            python3 scripts/native-stackwalk-test.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The LAN packet's layout. LANMessage is pack(1) and is sent as raw bytes, so its size and member
  # offsets are the wire format; it used to grow from 471 to 536 bytes off Windows because its text
  # fields were wchar_t. This compiles it at 32 and 64 bits with both wchar_t widths and requires
  # all four to agree, and requires the pre-port spelling to still fail.
  lanmessage-layout:
    name: LAN packet layout (32/64-bit)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04@sha256:3b06811b2afd352be909dd088a004166d665dc76d38b13eada33522a9d915c6f
    timeout-minutes: 20
    steps:
      - name: Install toolchain
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          # gcc-multilib is what supplies the 32-bit libstdc++ and libc headers clang needs for
          # -m32; without it the 32-bit half of the comparison cannot be measured at all.
          apt-get install -y --no-install-recommends \
            clang-14 gcc-multilib g++-multilib python3 git ca-certificates zlib1g-dev
          clang++-14 --version

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # SKIP_FFMPEG_LIBS: this job compiles one layout test and links no engine library, so
      # building FFmpeg's shared libraries would be minutes of runner time for nothing.
      - name: Provision the third-party headers
        env:
          SKIP_FFMPEG_LIBS: '1'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/ci/fetch-probe-deps.sh

      - name: Compare the LANMessage layout across 32/64-bit and both wchar_t widths
        run: |
          set -o pipefail
          {
            echo '## LAN packet layout'
            echo '```'
            python3 scripts/ci/check-lanmessage-layout.py --clangxx clang++-14
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The same width question one layer down: every external wide-text format (.csf, .map, save
      # game, replay, CRC, network packet) stores 16-bit code units, so this runs the real
      # WideCharWire.h at both wchar_t widths and requires the external bytes to be identical --
      # and requires the pre-port sizeof(WideChar) sizing to still desynchronise the .csf reader.
      - name: Convert wide text at the process boundary at both wchar_t widths
        run: |
          set -o pipefail
          {
            echo '## Wide character wire conversion'
            echo '```'
            python3 scripts/ci/check-widechar-wire.py --clangxx clang++-14
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # 3. Build the D3D8 -> Vulkan spike and render with it. Exit status is not the assertion:
  #    the framebuffer is read back and compared against the committed reference image, and the
  #    validation layer must be loaded and silent.
  renderer-spike-linux:
    name: Renderer spike (Linux, lavapipe)
    needs: changes
    if: needs.changes.outputs.renderer == 'true'
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
    timeout-minutes: 30
    steps:
      - name: Install toolchain and a software Vulkan device
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            clang-18 cmake ninja-build git ca-certificates python3 \
            libvulkan-dev vulkan-validationlayers glslang-tools mesa-vulkan-drivers
          # Fail loudly here rather than silently rendering on some other ICD or with no
          # validation layer.
          test -f /usr/share/vulkan/icd.d/lvp_icd.json
          test -f /usr/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -S spikes/renderer -B build/spike -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/spike

      - name: Render headless and compare the readback with the reference image
        env:
          # lavapipe: the CPU Vulkan device. Named explicitly so the job cannot accidentally
          # pass on some other ICD that happens to be installed.
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          XDG_RUNTIME_DIR: /tmp/xdgrt
        run: |
          set -o pipefail
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          unset DISPLAY
          {
            echo '## Renderer spike (Linux, lavapipe)'
            echo '```'
            python3 scripts/ci/check-spike-render.py \
              --binary build/spike/zh-renderer-spike \
              --reference spikes/renderer/docs/spike-triangle.png \
              --out spike-linux.png \
              --tolerance 2 --max-differing 0
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fixed-function pixel assertions
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          XDG_RUNTIME_DIR: /tmp/xdgrt
        run: |
          set -o pipefail
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          unset DISPLAY
          {
            echo '## Fixed-function pixel assertions (Linux, lavapipe)'
            echo '```'
            build/spike/zh-feature-probe
            build/spike/zh-fixedfunc-tests
            # MoltenVK has no image-view swizzle, so L8/A8/A8L8/X8R8G8B8 take a CPU
            # expansion path there. Exercise it here too, where it can be compared
            # against the swizzled result above.
            ZH_SPIKE_NO_VIEW_SWIZZLE=1 build/spike/zh-fixedfunc-tests
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The HiDPI rule at a backing scale no Linux display has. Headless with an injected scale,
      # which is the only honest way to run the Retina path here: at scale 1 the source and
      # destination extents of the presentation blit are equal and the pre-fix code passes, which is
      # exactly why the half-resolution defect survived Linux CI (docs/porting/hidpi-scale.md).
      - name: HiDPI points/pixels assertions at scale 2.00 and 1.25
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          XDG_RUNTIME_DIR: /tmp/xdgrt
        run: |
          set -o pipefail
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          unset DISPLAY
          {
            echo '## HiDPI points/pixels (Linux, lavapipe, injected backing scale)'
            echo '```'
            python3 scripts/ci/check-hidpi-scale.py --binary build/spike/zh-hidpi-tests
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: D3D8 Lock/Unlock assertions
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          XDG_RUNTIME_DIR: /tmp/xdgrt
        run: |
          set -o pipefail
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          unset DISPLAY
          {
            echo '## D3D8 Lock/Unlock usage classes (Linux, lavapipe)'
            echo '```'
            build/spike/zh-resource-lock-tests
            # The CPU expansion at unlock only runs where the view cannot swizzle,
            # which is MoltenVK's case; force it here so the path is covered.
            ZH_SPIKE_NO_VIEW_SWIZZLE=1 build/spike/zh-resource-lock-tests
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Staging cost ceiling
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          XDG_RUNTIME_DIR: /tmp/xdgrt
        run: |
          set -o pipefail
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          unset DISPLAY
          {
            echo '## Staging cost (Linux, lavapipe)'
            echo '```'
            # --self-check also runs the pre-pool per-resource-staging behaviour and
            # requires that it BREAKS this ceiling, so the gate is known to catch a
            # regression rather than only to pass.
            python3 scripts/ci/check-staging-cost.py \
              --binary build/spike/zh-staging-workload \
              --self-check
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Draws per frame, per draw. A mission frame issues thousands of draws and the backend gives
      # each one its own descriptor set and uniform slice, so this is a resource limit: before the
      # growable allocator the 65th draw was silently dropped and the frame was reported as a
      # success (docs/porting/draws-per-frame.md). --self-check reimposes the old fixed 64 and
      # requires that the gate fail, so it is known to catch that regression.
      - name: Draws per frame sustained without a dropped or aliased draw
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          XDG_RUNTIME_DIR: /tmp/xdgrt
        run: |
          set -o pipefail
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          unset DISPLAY
          {
            echo '## Draw capacity (Linux, lavapipe)'
            echo '```'
            python3 scripts/ci/check-draw-capacity.py \
              --binary build/spike/zh-draw-capacity \
              --self-check
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Re-derive the resource-seam counts
        run: |
          set -o pipefail
          {
            echo '## D3D8 resource seam'
            echo '```'
            python3 spikes/renderer/tools/d3d8-lock-scan.py --check
            python3 spikes/renderer/tools/surface-lock-audit.py --check
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the rendered image
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: spike-render-linux
          path: spike-linux.png

  # 4. The D3D8 surface scanner as a ratchet: direct (non-DX8Wrapper) call sites must match the
  #    checked-in allowlist exactly, so the consolidation cannot rot one call site at a time.
  d3d8-surface:
    name: D3D8 surface scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan
        run: python3 spikes/renderer/tools/d3d8-surface-scan.py | tee d3d8-surface-scan.txt

      - name: Gate the direct call surface against the allowlist
        run: |
          set -o pipefail
          {
            echo '## D3D8 direct call surface'
            echo '```'
            python3 scripts/ci/check-d3d8-surface.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The other half of the scoreboard: the scan above measures what the engine asks D3D8 for,
      # this measures what the Vulkan backend serves, method by method and state by state, and
      # fails on any regression or on an unclassified new method or state.
      - name: Gate the Vulkan backend's coverage of that surface
        run: |
          set -o pipefail
          {
            echo '## Vulkan backend coverage of the D3D8 surface'
            echo '```'
            python3 scripts/ci/check-backend-coverage.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Write the full coverage scoreboard
        if: always()
        run: python3 spikes/renderer/tools/backend-coverage-scan.py | tee backend-coverage.txt

      # Before any gate compares a number: assert the baselines are still readable. A hand-resolved
      # merge conflict once left native-build-shimmed-level1-2-3-4.json syntactically invalid on
      # main, and because every gate that reads it crashes rather than fails, it looked like a broken
      # script. This runs in the cheap job so the diagnosis arrives first.
      - name: Check the checked-in baselines parse
        run: python3 scripts/ci/check-generated-baselines.py

      # docs/porting/STATUS.md is generated from the same baselines and allowlist these gates read,
      # so it can only go stale if someone edits it by hand or refreshes a baseline without
      # regenerating it. Both are failures.
      - name: Check the generated status document is in sync
        run: python3 scripts/porting-status.py --check

      - name: Upload the scan
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: d3d8-surface-scan
          path: |
            d3d8-surface-scan.txt
            backend-coverage.txt

  # 5. The OpenAL replacement for Miles, built through the *real* top-level CMake build: the
  #    non-Windows branch of the root CMakeLists supplies `milesstub` from cmake/openal.cmake, and
  #    every audio consumer links that target, so this is the same wiring the engine gets. The job
  #    additionally checks the backend defines every AIL_* entry point it declares, and measures
  #    how much of the WWAudio consumer library compiles against it at 64-bit.
  #
  #    jammy ships CMake 3.22 and the root CMakeLists needs 3.25, hence the pip install.
  openal-backend:
    name: OpenAL backend build (Linux)
    needs: changes
    if: needs.changes.outputs.audio == 'true'
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04@sha256:3b06811b2afd352be909dd088a004166d665dc76d38b13eada33522a9d915c6f
    timeout-minutes: 20
    steps:
      - name: Install toolchain
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            clang-14 ninja-build git ca-certificates python3 python3-pip binutils libopenal-dev
          pip3 install --no-cache-dir 'cmake==4.1.2'
          cmake --version

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure the top-level build off Windows
        env:
          CC: clang-14
          CXX: clang++-14
        run: |
          set -eux
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DRTS_BUILD_ZEROHOUR=ON -DRTS_BUILD_GENERALS=OFF

      - name: Build the audio backend
        run: cmake --build build/native --target core_openalaudiodevice

      - name: Check every declared AIL_* entry point is defined
        run: |
          set -o pipefail
          {
            echo '## OpenAL backend'
            echo '```'
            python3 scripts/ci/check-openal-symbols.py \
              --header Core/Libraries/Source/OpenALAudioDevice/mss/mss.h \
              --archive build/native/Core/Libraries/Source/OpenALAudioDevice/libcore_openalaudiodevice.a
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Measure the AIL_* surface and the backend's coverage of it
        run: |
          set -o pipefail
          {
            echo '## Miles API surface vs OpenAL coverage'
            echo '```'
            python3 scripts/audio-surface-scan.py --check
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Measure how much of WWAudio compiles against the backend
        run: |
          set -o pipefail
          # Not a gate on zero failures: 9 of the 19 TUs are blocked by WWSaveLoad's 32-bit
          # pointer-as-save-id (persistfactory.h:123), which is the save/load 64-bit slice, not
          # this one. Gate on not regressing below the measured count instead.
          expected=10
          cmake --build build/native --target z_wwaudio -- -k 0 > /tmp/wwaudio.log 2>&1 || true
          objdir=build/native/GeneralsMD/Code/Libraries/Source/WWVegas/WWAudio/CMakeFiles/z_wwaudio.dir
          clean=$(find "$objdir" -name '*.cpp.o' | wc -l)
          {
            echo '## WWAudio consumer TUs compiling at 64-bit'
            echo '```'
            echo "$clean / 19 object files built (expected at least $expected)"
            grep -oE '(fatal )?error: [^[]*' /tmp/wwaudio.log | sort | uniq -c | sort -rn || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$clean" -ge "$expected"

  # 6. The same spike on Apple Silicon through MoltenVK. This exists to guard the
  #    VK_KHR_portability_enumeration / VK_KHR_portability_subset opt-in: without it the Khronos
  #    loader does not report MoltenVK at all, and nothing on Linux would notice it being
  #    deleted.
  #
  #    macos-15, not macos-14, and that is not cosmetic: on macos-14 Homebrew's MoltenVK 1.4.2
  #    aborts inside MVKPhysicalDevice::initMetalFeatures against the runner's paravirtualised
  #    Metal device ("-[AppleParavirtDevice newArgumentEncoderWithLayout:]: unrecognized
  #    selector"). Even `vulkaninfo` crashes there. macos-15 enumerates the device fine. Measured,
  #    see the PR description.
  #
  #    Scope, honestly: the runner is a VM with a paravirtualised GPU, not the M1 Pro
  #    docs/porting/moltenvk-findings.md was measured on, and MoltenVK is a translation layer, so
  #    the rasterisation need not be bit-identical to llvmpipe's (on real hardware it was within
  #    1/255). This job therefore asserts:
  #      * vkCreateInstance succeeds against a portability driver, which is precisely the
  #        VK_ERROR_INCOMPATIBLE_DRIVER failure the opt-in exists to prevent;
  #      * the validation layer is loaded and silent, which the gates now assert rather than
  #        assume: the "Resolve the Vulkan manifests" step below rewrites Homebrew's manifests with
  #        absolute library_paths, because the DYLD_LIBRARY_PATH this used to rely on does not
  #        survive SIP's exec of /usr/bin/python3 and its absence reads as a clean run;
  #      * the readback is within a loose tolerance of the same reference image.
  #    It does NOT assert pixel equality with the Linux reference: the Linux job owns that.
  renderer-spike-macos:
    name: Renderer spike (macOS arm64, MoltenVK)
    needs: changes
    if: needs.changes.outputs.renderer == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install MoltenVK, the Vulkan loader and glslang
        run: |
          set -eux
          brew update > /dev/null
          brew install molten-vk vulkan-loader vulkan-headers vulkan-tools glslang \
                       vulkan-validationlayers
          command -v cmake > /dev/null || brew install cmake
          brew list --versions molten-vk vulkan-loader glslang vulkan-validationlayers

      - name: Build
        run: |
          set -eux
          BREW=$(brew --prefix)
          # SDL2 is off deliberately: Homebrew's SDL2 headers are x86-only in this install and
          # break the arm64 build (immintrin.h). Headless is the path under test anyway.
          cmake -S spikes/renderer -B build/spike -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPIKE_USE_SDL2=OFF \
            -DCMAKE_PREFIX_PATH="$BREW"
          cmake --build build/spike -j3

      # The loader environment for every step below, resolved once. Both formulae are kegs whose
      # manifests name their dylib by leaf name, so the loader used to need DYLD_LIBRARY_PATH --
      # which SIP strips when /bin/bash or /usr/bin/python3 is exec'd, leaving a gate that either
      # dies with VK_ERROR_LAYER_NOT_PRESENT or, worse, runs unvalidated and reports zero
      # validation messages (docs/porting/apple-silicon-verification.md 8.1). The manifests are
      # rewritten with absolute library_paths instead, and VK_LAYER_PATH / VK_ICD_FILENAMES are not
      # DYLD_* and survive. --require-layer means a missing layer fails here rather than silently
      # later.
      - name: Resolve the Vulkan manifests with absolute library paths
        run: |
          set -eux -o pipefail
          python3 scripts/ci/vulkan_manifests.py --github-env --require-layer

      - name: Render headless through MoltenVK and compare the readback
        run: |
          set -eux -o pipefail
          test -f "$VK_ICD_FILENAMES"
          vulkaninfo --summary | head -30 || true
          {
            echo '## Renderer spike (macOS arm64, MoltenVK)'
            echo '```'
            python3 scripts/ci/check-spike-render.py \
              --binary build/spike/zh-renderer-spike \
              --reference spikes/renderer/docs/spike-triangle.png \
              --out spike-macos.png \
              --tolerance 8 --max-differing 0.01
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fixed-function pixel assertions through MoltenVK
        run: |
          set -eux -o pipefail
          {
            echo '## Fixed-function pixel assertions (macOS arm64, MoltenVK)'
            echo '```'
            build/spike/zh-feature-probe
            build/spike/zh-fixedfunc-tests
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The same injected-scale assertions through MoltenVK, where the point-to-pixel arithmetic
      # actually has to hold. Still not a Retina answer: the runner has no display, so the real
      # backingScaleFactor path is spikes/renderer/tools/macos-window-check.sh on a Mac session.
      - name: HiDPI points/pixels assertions through MoltenVK
        run: |
          set -eux -o pipefail
          {
            echo '## HiDPI points/pixels (macOS arm64, MoltenVK, injected backing scale)'
            echo '```'
            python3 scripts/ci/check-hidpi-scale.py --binary build/spike/zh-hidpi-tests
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The Lock/Unlock emulation on the device it is actually for. The author has no
      # Mac: everything this job asserts about MoltenVK was written blind and this run
      # is the only evidence for it.
      - name: D3D8 Lock/Unlock assertions through MoltenVK
        run: |
          set -eux -o pipefail
          {
            echo '## D3D8 Lock/Unlock usage classes (macOS arm64, MoltenVK)'
            echo '```'
            build/spike/zh-resource-lock-tests
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The draw-capacity gate on the device the defect was found on: the dropped draws were
      # measured through MoltenVK, and its descriptor-set allocation is its own implementation.
      - name: Draws per frame through MoltenVK
        run: |
          set -eux -o pipefail
          {
            echo '## Draw capacity (macOS arm64, MoltenVK)'
            echo '```'
            python3 scripts/ci/check-draw-capacity.py \
              --binary build/spike/zh-draw-capacity \
              --self-check
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The same workload the Linux job gates on, run for its numbers only: MoltenVK's
      # allocation sizes and its lack of image-view swizzle move the byte counts, and the
      # committed ceiling was measured on lavapipe. Printed, not asserted.
      - name: Staging cost (numbers only, not gated)
        run: |
          set -eux -o pipefail
          {
            echo '## Staging cost (macOS arm64, MoltenVK) -- reported, not gated'
            echo '```'
            build/spike/zh-staging-workload --frames 12
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the rendered image
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: spike-render-macos
          path: spike-macos.png

  # 6. The window / event loop / input seam (docs/porting/window-event-loop.md).
  #
  #    This is the job that presents to a real window, which nothing in this workflow did
  #    before: a real X server (Xvfb), a real VkSurfaceKHR from VK_KHR_xlib_surface, and a real
  #    swapchain, presented to for 240 frames and then read back and checked. Xvfb is a display
  #    server without a monitor, so this proves the surface/swapchain/present path and the
  #    event translation; it cannot prove that pixels reached a physical screen. That was
  #    verified by hand on a desktop X session - see the doc.
  window-seam-linux:
    name: Window seam (Linux, Xvfb + lavapipe)
    needs: changes
    if: needs.changes.outputs.window == 'true'
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
    timeout-minutes: 30
    steps:
      - name: Install toolchain, SDL2, a software Vulkan device and an X server
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            clang-18 cmake ninja-build git ca-certificates python3 \
            libvulkan-dev vulkan-validationlayers glslang-tools mesa-vulkan-drivers \
            libsdl2-dev xvfb
          test -f /usr/share/vulkan/icd.d/lvp_icd.json
          test -f /usr/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The three source-only window checks that used to run here are in `source-scans` now: they
      # need no build, and window-input-scan.py walks the whole repository, so gating them on the
      # window path list would have let an unrelated engine file move a counted surface unchecked.

      - name: Build the seam and the window spike
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          set -eux
          cmake -S spikes/renderer -B build/spike -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/spike --target zh-window-spike

      - name: Present 240 frames to a real X11 window and check the readback
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          XDG_RUNTIME_DIR: /tmp/xdgrt
        run: |
          set -o pipefail
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          {
            echo '## Window seam (Linux, Xvfb + lavapipe)'
            echo '```'
            xvfb-run -a --server-args="-screen 0 1280x1024x24" \
              build/spike/zh-window-spike --frames 240 --mode-change \
                --out window-spike-linux.png
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the presented frame
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: window-spike-linux
          path: window-spike-linux.png

  # 7. The macOS half of the same seam. This job used to be continue-on-error and expected to
  #    fail, because platform_window_cocoa.mm had been written on a Linux box with no macOS SDK
  #    and had never been compiled. It is now a gate: the Objective-C++ compiles, its 104
  #    kVK_* literals are checked against HIToolbox at compile time, its mirror of
  #    VkMetalSurfaceCreateInfoEXT is static_asserted against the real MoltenVK header, and
  #    zh-metal-surface-probe creates a real VkSurfaceKHR from a real CAMetalLayer through
  #    vkCreateMetalSurfaceEXT and presents through a swapchain.
  #
  #    The NSWindow path works here too, which was not expected: see the step below. What this
  #    job still cannot prove, and what a Mac with a login session is still needed for
  #    (spikes/renderer/tools/macos-window-check.sh):
  #      * that anything reached a screen. The runner has no attached display, so window
  #        visibility, ordering and a Retina contentsScale of 2 are all uncovered;
  #      * keyboard and mouse translation: nobody types on a runner, so the kVK_* table is
  #        proven against HIToolbox's constants but not against a real keypress, and the
  #        bottom-left-to-top-left mouse flip is unexercised.
  window-seam-macos:
    name: Window seam (macOS arm64, CAMetalLayer)
    needs: changes
    if: needs.changes.outputs.window == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install MoltenVK, the Vulkan loader and glslang
        run: |
          set -eux
          brew update > /dev/null
          # SDL2 is deliberately not installed: Homebrew's SDL2 headers are x86-only in this
          # image and break the arm64 build (immintrin.h), which is why the renderer spike job
          # configures with -DSPIKE_USE_SDL2=OFF too. The Cocoa backend is the path under test.
          brew install molten-vk vulkan-loader vulkan-headers glslang vulkan-tools
          command -v cmake > /dev/null || brew install cmake
          brew list --versions molten-vk vulkan-loader vulkan-headers glslang

      # As in the renderer spike job: the ICD manifest is rewritten with an absolute library_path,
      # so the loader finds MoltenVK without a DYLD_* variable SIP would strip. No --require-layer
      # here, because this job does not install the validation layer.
      - name: Resolve the Vulkan manifests with absolute library paths
        run: |
          set -eux -o pipefail
          python3 scripts/ci/vulkan_manifests.py --github-env

      - name: Check both backends' scan-code tables against KeyScanCodes.h
        run: |
          set -o pipefail
          {
            echo '## Scan-code tables (macOS runner)'
            echo '```'
            python3 scripts/ci/check-window-scancodes.py
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compile the Cocoa backend and the Metal surface probe
        run: |
          set -o pipefail
          BREW=$(brew --prefix)
          {
            echo '## Window seam (macOS, Cocoa/CAMetalLayer path)'
            echo 'Compiles platform_window_cocoa.mm with WWLIB_COCOA_VERIFY_KVK, so the'
            echo 'kVK_* table and the VkMetalSurfaceCreateInfoEXT mirror are compile-time'
            echo 'assertions rather than comments.'
            echo '```'
            cmake -S spikes/renderer -B build/spike -G "Unix Makefiles" \
              -DCMAKE_BUILD_TYPE=Release -DSPIKE_USE_SDL2=OFF \
              -DCMAKE_PREFIX_PATH="$BREW" 2>&1
            cmake --build build/spike --target zh-window-spike-cocoa \
              zh-metal-surface-probe -j3 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The gate: CAMetalLayer -> vkCreateMetalSurfaceEXT -> VkSurfaceKHR -> swapchain ->
      # present, none of which needs a window. If VK_EXT_metal_surface stops being advertised,
      # or the entry point stops resolving the way the seam resolves it
      # (dlsym(RTLD_DEFAULT, "vkGetInstanceProcAddr")), this fails.
      - name: Create a VkSurfaceKHR from a CAMetalLayer through MoltenVK
        run: |
          set -o pipefail
          test -f "$VK_ICD_FILENAMES"
          {
            echo '## VK_EXT_metal_surface on this runner'
            echo '```'
            build/spike/zh-metal-surface-probe
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The NSWindow half, which turned out to work on this runner: the first run of this job
      # created an NSWindow, presented 120 frames through its CAMetalLayer and read the pixels
      # back with 0 validation messages, so it is a gate too rather than a log to read. If a
      # future runner image has no windowing session this is the step that will say so.
      - name: Present to an NSWindow's CAMetalLayer
        run: |
          set -o pipefail
          {
            echo '## Cocoa NSWindow run'
            echo '```'
            build/spike/zh-window-spike-cocoa --frames 120 --no-validation \
              --out window-spike-macos.png 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The standalone check a Mac session runs, in the mode that tolerates having no display,
      # so that the script itself is exercised rather than only documented.
      - name: Run the standalone macOS window check (no-display mode)
        run: |
          set -o pipefail
          {
            echo '## spikes/renderer/tools/macos-window-check.sh --allow-no-display'
            echo '```'
            spikes/renderer/tools/macos-window-check.sh --allow-no-display --no-sdl2 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload whatever it produced
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: window-spike-macos
          path: window-spike-macos.png
          if-no-files-found: ignore

  # 8. One check for branch protection to require. Every job above is now conditional, and a
  #    required check that is skipped never reports, so requiring them individually would either
  #    block a docs-only pull request forever or have to be edited every time a job is added or
  #    renamed. This job runs unconditionally, so it always reports, and it fails if anything it
  #    depends on failed or was cancelled -- a skipped job is a pass, which is the whole point of
  #    the gating above.
  required-checks:
    name: Native port CI
    if: always()
    needs:
      - changes
      - lint
      - source-scans
      - native-probe
      - native-build
      - native-build-renderer
      - debug-profile-seam
      - debug-profile-seam-macos
      - lanmessage-layout
      - renderer-spike-linux
      - d3d8-surface
      - openal-backend
      - renderer-spike-macos
      - window-seam-linux
      - window-seam-macos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report every job's result and fail on any failure
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          lines = ["## Job results", "", "| job | result |", "| --- | --- |"]
          bad = []
          for job in sorted(needs):
              result = needs[job]["result"]
              lines.append(f"| {job} | {result} |")
              # `skipped` is a pass: the change could not move that measurement.
              if result not in ("success", "skipped"):
                  bad.append(f"{job}: {result}")

          summary = "\n".join(lines)
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary + "\n")

          if bad:
              print("\nfailed: " + ", ".join(bad))
              sys.exit(1)
          PY
